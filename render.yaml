# Render Blueprint for the appointment/contact API (free web service).
# Render dashboard → New → Blueprint → select this repository.
# Secrets marked `sync: false` are entered in the dashboard, never committed.
services:
  - type: web
    name: hospital-website-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://your-hospital.vercel.app,https://www.yourhospital.ug
      - key: HOSPITAL_NAME
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: hospital_website
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: SEND_PATIENT_ACK
        value: "false"
